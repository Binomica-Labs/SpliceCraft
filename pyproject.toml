[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name            = "splicecraft"
version         = "1.3.8"
description     = "Terminal-based circular plasmid map viewer, sequence editor, and Primer3/Golden Braid primer design workbench"
readme          = "README.md"
requires-python = ">=3.10"
license         = { file = "LICENSE" }
authors = [
    { name = "Binomica Labs" },
]
keywords = [
    "bioinformatics", "plasmid", "genbank", "molecular-biology",
    "tui", "terminal", "primer3", "golden-braid", "cloning",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Terminals",
]
dependencies = [
    # Pin floors track the versions the test suite is verified
    # against (refreshed 2026-09-21 to current PyPI latest). End-user
    # `pipx install splicecraft` pulls the matching minimum so
    # behaviour matches what shipped.
    "textual>=8.2.8",
    # Capped <1.87 (2026-06-05): biopython 1.87 DROPPED its Intel-macOS
    # (x86_64) wheels — only arm64 / manylinux / win remain — so `pipx
    # install splicecraft` on an Intel Mac would compile biopython (a
    # large C extension; slow, needs a full toolchain). 1.86 still ships
    # macosx x86_64 wheels for cp310–313 and has every API SpliceCraft
    # uses. biopython is mandatory with NO fallback, so it MUST resolve to
    # a wheel on every supported platform. Revisit the cap when a later
    # release re-adds Intel-mac wheels — `scripts/check_dep_wheels.py`
    # flags it if 1.86 ever loses coverage too.
    # Re-checked 2026-09-21: 1.88 (Aug 2026) still ships no x86_64 macOS
    # wheel, so the cap holds. Nothing is lost by holding: 1.87's CVE fix
    # (CVE-2025-68463) is in `Bio.Entrez.Parser`, which only
    # `Entrez.read`/`Entrez.parse` reach — SpliceCraft calls `Entrez.efetch`
    # and reads the raw text — and 1.88's fix is in `Bio.Nexus`, unused
    # here. The suite passes against 1.88 too, so lifting the cap later is
    # a packaging decision, not a porting job.
    "biopython>=1.86,<1.87",
    # No edlib (removed 2026-09-30, [INV-212]). It ran in front of the
    # built-in aligner only where it had a wheel (Python <= 3.13), picked
    # different equal-cost alignments there (phantom variants on reads
    # missing an end), and the release machine could not install it, so
    # the suite that gates releases never saw them. One engine everywhere;
    # tests/test_alignment_overlay.py fails if it comes back.
    # 2.3.1 (2026-09-06) fixes out-of-bounds reads in the bundled Primer3 C
    # engine — `oligotm` on short sequences and the lookup tables on
    # non-ASCII input — plus a heap overflow in intron-list parsing, and stops
    # `design_primers` mutating the caller's `global_args` dict. Primer
    # design is catastrophic-class, so the floor sits at the fixed release.
    "primer3-py>=2.3.1",
    # 4.11 (2026-09) follows the XDG spec and IGNORES a non-absolute
    # `$XDG_DATA_HOME` (a relative path, or a `~/…` nothing expanded) that
    # 4.10 honoured relative to the working directory. A library that
    # lived at such a path would appear to vanish, so `_user_data_dir`
    # detects that case and says where the old data is — see
    # `_legacy_relative_xdg_notice`.
    "platformdirs>=4.11.11",
    # pyhmmer powers the BLAST modal's BLASTN (nhmmer), BLASTP (phmmer),
    # and HMMscan tiers — pure-Python bindings to HMMER 3 with no
    # external C-library install required (the wheels ship the HMMER
    # source compiled in). The pure-Python BLAST fallback also runs
    # without pyhmmer for very short queries.
    #
    # POSIX-only marker (added 2026-05-29): HMMER's C core does not build
    # on native Windows with the Microsoft toolchain — upstream states
    # "non-UNIX operating systems (such as Windows) are not supported by
    # HMMER." As an unconditional hard dep it broke `pipx install
    # splicecraft` for native-Windows users entirely ("No matching
    # distribution found").
    # Re-checked 2026-09-21: pyhmmer HAS shipped MinGW-built win_amd64
    # wheels since 0.12.0 (cp310, cp311, cp312-abi3), but upstream labels
    # them EXPERIMENTAL and warns that some Easel errors "may be uncaught
    # and cause a system exit" — i.e. take the whole TUI down with no
    # Python exception to catch. Until that is verified on real Windows
    # the marker stays; a native-Windows user who wants HMMscan anyway can
    # `pip install pyhmmer` into the same environment, since the import is
    # optional (`_PYHMMER_AVAILABLE`). 0.12.2 fixed a segfault in
    # `HMM.__eq__`; 0.12.3 fixed the `plan7.pyi` stub that pyright reads.
    # The marker keeps it a hard dep everywhere it CAN install — Linux, macOS, and
    # WSL (which reports as sys_platform == 'linux') — so no existing
    # user loses HMMscan, and omits it ONLY on native Windows. There the
    # app degrades gracefully: BLASTN/BLASTP fall back to the pure-Python
    # engine and the HMMscan button shows a "run under WSL2" hint
    # (gated by `_PYHMMER_AVAILABLE` → `_handle_hmmscan_request`).
    "pyhmmer>=0.12.3; sys_platform != 'win32'",
    # Experiments lab-notebook deps (added 2026-05-18 with the
    # Experiments toolbar). All three are pure-Python wheels with no
    # external system shell-outs:
    #   * Pillow — read attached image bytes, opportunistic clipboard
    #     grab via `ImageGrab.grabclipboard()` on Win/Mac (Linux/WSL
    #     falls back to the file picker).
    #   * pyspellchecker — bundled English wordlist, no network at
    #     runtime; powers the F7 / Spellcheck button's misspelling
    #     detection in the Compose pane.
    #   * rich-pixels — renders attached images as Unicode half-blocks
    #     in any terminal (no kitty/sixel/iTerm graphics protocol
    #     required), used in the Attachments grid preview.
    "Pillow>=12.3.0",
    # pyspellchecker floor stays at 0.8.0 because conda-forge's
    # newest build is still 0.8.0 (0.9.0 hasn't landed there yet).
    # Bumping the floor above 0.8.0 makes the bioconda Linux Tests
    # solver fail with `Unsatisfiable dependencies for platform
    # linux-64: {MatchSpec("pyspellchecker[version='>=0.9.0']")}`.
    # `pipx install splicecraft` still resolves to whatever's
    # latest on PyPI (currently 0.9.0). Revisit when conda-forge
    # publishes 0.9.x — re-checked 2026-06-01 and again 2026-09-21 (full
    # dep-bump sweeps): conda-forge STILL caps at 0.8.0, so this floor is
    # deliberately held back from "latest" while everything else moves up.
    "pyspellchecker>=0.8.0",
    "rich-pixels>=3.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.8.0",
    "hypothesis>=6.168.0",
    # Parses CITATION.cff for real in tests/test_citation.py. A YAML syntax
    # error there breaks GitHub's "Cite this repository" button in public and
    # the regex readers cannot see it; without this dep that test silently
    # skips. Dev-only -- never a runtime or conda run dependency.
    "pyyaml>=6.0.3",
    "build>=1.6.1",
    # `build` runs the backend in an ISOLATED env, so it does not put hatchling
    # in the test env. tests/test_import_layers.py asks the real builders which
    # files they collect (the only way to catch a symlink silently pruning
    # `skills/` out of the sdist, and so out of the wheel built from it), which
    # needs hatchling importable here. Mirror the [build-system] floor.
    "hatchling>=1.32.4",
    # Floor-pinned at 7.0.0 (2026-08-15): hatchling 1.32 emits
    # `Metadata-Version: 2.5`, which twine 6.x rejects as invalid even though
    # PyPI accepts it. An older twine fails `twine check` at the very end of a
    # release, after the full suite has already run.
    "twine>=7.0.0",
    # Linters / type-checkers / coverage — mirror what CI runs
    # so local + CI behaviour stays in step (see test.yml).
    "ruff>=0.16.8",
    # `pyright` is floor-pinned at the most recent release. The dev
    # / CI install ALWAYS pulls latest via PYRIGHT_PYTHON_FORCE_VERSION
    # (set in test.yml + recommended for local). The pip-resolved
    # version is only the bootstrap; the launcher then downloads the
    # current latest into a managed cache and runs it. `release.py`
    # upgrades the wrapper itself (`_upgrade_pyright`) before the lint
    # gate runs, so the floor here tracks what a release last used
    # rather than drifting years behind it.
    "pyright>=1.1.414",
    "coverage>=7.16.1",
]

[project.urls]
Homepage   = "https://github.com/Binomica-Labs/SpliceCraft"
Repository = "https://github.com/Binomica-Labs/SpliceCraft"
Issues     = "https://github.com/Binomica-Labs/SpliceCraft/issues"
Changelog  = "https://github.com/Binomica-Labs/SpliceCraft/blob/master/CHANGELOG.md"

[project.scripts]
splicecraft     = "splicecraft:main"
# Stdlib-only sidecar (~50 ms startup) for external AI agents driving
# the running GUI via the localhost agent-API. See `splicecraft --help`
# for `--agent-api` and the README's "Agent API" section.
splicecraft-cli = "splicecraft_cli:main"

[tool.hatch.build.targets.wheel]
# CHANGELOG.md is bundled so the in-app "What's New" modal works for
# every install path (pipx, pip, conda) — without it `_load_whats_new_body`
# falls back to the GitHub-link placeholder.
only-include = [
    "splicecraft.py",
    "splicecraft_cli.py",
    # First deliberate extraction from the single-file rule —
    # pure biology primitives (`_rc`, `_iupac_pattern`,
    # `_feat_len`, etc.) live here and are re-imported by
    # splicecraft.py. See its module docstring + the
    # CONTRIBUTING three-test rule for the extraction
    # criteria. Must ship in the wheel or `import splicecraft`
    # fails at the import-back step.
    "splicecraft_biology.py",
    # Demo-mode seed data (FFE Golden-Braid / MoClo set) — imported by
    # PlasmidApp._seed_demo_data; must ship in the wheel or the demo seed
    # silently falls back to an empty library.
    "splicecraft_demo_plasmids.py",
    # Modularization siblings (flat-sibling refactor) — the hub re-imports each,
    # so every one MUST ship in the wheel or `import splicecraft` fails at the
    # re-import step. tests/test_import_layers.py guards this list stays complete.
    "splicecraft_errors.py",
    "splicecraft_state.py",
    "splicecraft_logging.py",
    # The domain-agnostic save/load engine (safe_save_json + backups + the
    # data-safety chokepoint). SACRED: if this is missing from the wheel,
    # `import splicecraft` fails at the re-import step and NO save path works.
    "splicecraft_persistence.py",
    "splicecraft_dataaccess.py",
    "splicecraft_render.py",
    "splicecraft_history.py",
    "splicecraft_widgets.py",
    "splicecraft_modals.py",
    "splicecraft_util.py",
    "splicecraft_record.py",
    "splicecraft_cloning.py",
    "splicecraft_seqanalysis.py",
    "splicecraft_gels.py",
    "splicecraft_experiments.py",
    "splicecraft_fileio.py",
    "splicecraft_codon.py",
    "splicecraft_net.py",
    "splicecraft_search.py",
    "splicecraft_primer.py",
    "splicecraft_backup.py",
    "splicecraft_agent.py",
    "splicecraft_babs.py",
    # OT-2 (Opentrons) protocol compiler + robot-server LAN client sibling.
    "splicecraft_opentrons.py",
    # Circular plasmid-map image export (SVG + PNG) sibling.
    "splicecraft_mapimage.py",
    # Plant splice-site scoring + its vendored PWM data, and the eukaryotic
    # expression-cassette assembler.
    "splicecraft_splice.py",
    "splicecraft_splice_model.py",
    "splicecraft_cassette.py",
    # Curated built-in feature presets (read-only catalogue of common
    # plasmid elements, verified against public GenBank records).
    "splicecraft_presets.py",
    # CRISPR guide design: PAM scanning, guide triage, off-target search
    # within supplied sequences, cloning oligos.
    "splicecraft_crispr.py",
    # Bacterial regulatory-element scanners: sigma-70 promoters and
    # intrinsic (Rho-independent) terminators, both wrap-aware.
    "splicecraft_regulatory.py",
    # The Claude Skill that teaches an AI agent to drive the agent API
    # (connect, the canvas/library model, coordinates, the failure modes
    # that look like success). Ships with the package so an agent working
    # in any project can install it from the user's existing SpliceCraft
    # install — see README "Claude Skill". Data only; nothing imports it.
    "plugin/skills/splicecraft",
    "CHANGELOG.md",
]

[tool.hatch.build.targets.sdist]
include = [
    "splicecraft.py",
    "splicecraft_biology.py",
    "splicecraft_cli.py",
    "splicecraft_demo_plasmids.py",
    "splicecraft_errors.py",
    "splicecraft_state.py",
    "splicecraft_logging.py",
    "splicecraft_persistence.py",
    "splicecraft_dataaccess.py",
    "splicecraft_render.py",
    "splicecraft_history.py",
    "splicecraft_widgets.py",
    "splicecraft_modals.py",
    "splicecraft_util.py",
    "splicecraft_record.py",
    "splicecraft_cloning.py",
    "splicecraft_seqanalysis.py",
    "splicecraft_gels.py",
    "splicecraft_experiments.py",
    "splicecraft_fileio.py",
    "splicecraft_codon.py",
    "splicecraft_net.py",
    "splicecraft_search.py",
    "splicecraft_primer.py",
    "splicecraft_backup.py",
    "splicecraft_agent.py",
    "splicecraft_babs.py",
    "splicecraft_opentrons.py",
    "splicecraft_mapimage.py",
    "splicecraft_splice.py",
    "splicecraft_splice_model.py",
    "splicecraft_cassette.py",
    # Curated built-in feature presets (read-only catalogue of common
    # plasmid elements, verified against public GenBank records).
    "splicecraft_presets.py",
    # CRISPR guide design: PAM scanning, guide triage, off-target search
    # within supplied sequences, cloning oligos.
    "splicecraft_crispr.py",
    # Bacterial regulatory-element scanners: sigma-70 promoters and
    # intrinsic (Rho-independent) terminators, both wrap-aware.
    "splicecraft_regulatory.py",
    # The Claude Skill for driving the agent API (see the wheel target), plus
    # the plugin/marketplace manifests that make this repo installable with
    # `claude plugin marketplace add Binomica-Labs/SpliceCraft`.
    "plugin/**",
    ".claude-plugin/**",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    # Citation metadata travels with the source tarball so downstream
    # packagers (conda-forge, distro maintainers) and anyone unpacking the
    # sdist can find the DOI + preferred citation without the git repo.
    "CITATION.cff",
    "splicecraftLogo.png",
    "splicecraftScreenshot.png",
    "tests/**",
    "pyproject.toml",
]
# .dna (popular commercial plasmid editor binary) fixtures live in tests/ for local integration
# tests but are NOT redistributed through PyPI — they're real lab
# plasmids, and the pytest suite skips the related tests when absent.
exclude = [
    "tests/*.dna",
]

[tool.ruff]
# Ruff is the lightweight bug-finding / lint gate. The strict
# correctness gate is pyright (see `[tool.pyright]` below) + the full
# pytest suite. Ruff sits in front of both to catch the cheap stuff
# fast.
#
# We pick a TIGHT ruleset on purpose:
#   * F — all of pyflakes (real bugs: undefined names, unused vars,
#         f-string-without-placeholder, etc.)
#   * E9 — syntax errors only (the rest of E is style, and conflicts
#         with intentional codebase choices like mid-file lazy imports
#         and one-line `if x: do()` for tight conditionals).
#
# `B` (bugbear) and `UP` (pyupgrade) are deliberately NOT enabled
# today: bugbear flags several intentional patterns (synchronous
# closure capture, `zip()` without `strict=`) as smells. They're
# tracked as a follow-up sweep, after which they'll be enabled here.
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E9"]
# tests/ runs duck-typed against Textual / BioPython internals and
# uses fixtures whose names look unused to the linter; skip the
# noise. Production code is what ruff guards.
exclude = ["tests/**", ".hypothesis/**", "build/**", "dist/**"]

[tool.ruff.format]
# Hands off. Formatting the whole 61k-LoC file would produce a churn
# diff that destroys git blame for no behavioural gain. Re-enable
# once a dedicated formatting sweep is scheduled.
exclude = ["*"]

[tool.pyright]
# Pyright is configured ONLY here (no sibling pyrightconfig.json).
# Pyright loads pyrightconfig.json over [tool.pyright] when both
# exist; keeping a single source of truth in pyproject.toml means
# real TOML comments stay readable (vs the JSONC hack the JSON
# file required).
#
# Main-source code is analysed strictly. Tests are included with a
# per-directory `executionEnvironment` override below — they
# duck-type on Textual's `App.push_screen()` return (`Screen[object]`),
# assert non-None after explicit guards pyright can't narrow, and
# call BioPython APIs whose stubs don't model `Position |
# ExactPosition` precisely. Suppressing the noise on the test tree
# lets genuine errors on the application surface stay visible. Real
# test breakage is caught by `pytest -n auto -q`.
include = [
    # The hub + EVERY flat `splicecraft_*` sibling (2026-06-30): the siblings
    # were previously un-gated (only the hub + a few were listed), so latent
    # Optional-handling errors crept into `splicecraft_agent` / `_babs` unseen.
    # The whole module surface is now strictly type-checked; a new sibling is
    # auto-covered (and `test_import_layers` guards that it's a real module).
    "splicecraft*.py",
    "tests",
]
exclude = [
    "build/**",
    "dist/**",
    "**/__pycache__/**",
    ".venv/**",
    "venv/**",
]
extraPaths = ["."]
reportUnreachable = "none"
reportUnnecessaryComparison = "none"

# INV-73 (2026-05-25): tests interact with Textual widgets via
# `query_one(selector)` — base-Widget return type, dynamic attrs,
# Optional record access. These patterns are pervasive in TUI
# integration tests and don't reflect real safety issues. Main-source
# rules above stay strict.
[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportAttributeAccessIssue = "none"
reportOptionalMemberAccess = "none"
reportOptionalSubscript = "none"
reportArgumentType = "none"
reportCallIssue = "none"
reportReturnType = "none"
reportGeneralTypeIssues = "none"
reportUnusedVariable = "none"
reportIndexIssue = "none"
reportOperatorIssue = "none"


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:Bio.*",
    "ignore::PendingDeprecationWarning:Bio.*",
]
# Custom test markers. `slow` is for test classes / functions that
# do heavy I/O (snapshot creation, BLAST DB build, large-plasmid
# render, full domestication workflow). Default test runs include
# them; a fast inner-loop CI job can pass `-m "not slow"` to skip
# them. Registering the marker here silences pytest's "unknown
# marker" warning.
markers = [
    "slow: heavy-I/O or long-running test (use `-m 'not slow'` to skip)",
]
